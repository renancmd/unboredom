<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Unboredom - Term</title>
        <link rel="stylesheet" href="./css/term.css" />
        <link rel="shortcut icon" href="#" type="image/x-icon" />
    </head>

    <body>
        <header>
            <h1 id="title">Unboredom</h1>
            <button id="otherGameButton">Jogar outro jogo</button>
        </header>
        <main>
            <div id="container-displays" class="container-displays">
                <div class="display">
                    <div class="box unfocused" id="box-1-1"></div>
                    <div class="box unfocused" id="box-1-2"></div>
                    <div class="box unfocused" id="box-1-3"></div>
                    <div class="box unfocused" id="box-1-4"></div>
                    <div class="box unfocused" id="box-1-5"></div>
                </div>
                <div class="display">
                    <div class="box unfocused" id="box-2-1"></div>
                    <div class="box unfocused" id="box-2-2"></div>
                    <div class="box unfocused" id="box-2-3"></div>
                    <div class="box unfocused" id="box-2-4"></div>
                    <div class="box unfocused" id="box-2-5"></div>
                </div>
                <div class="display">
                    <div class="box unfocused" id="box-3-1"></div>
                    <div class="box unfocused" id="box-3-2"></div>
                    <div class="box unfocused" id="box-3-3"></div>
                    <div class="box unfocused" id="box-3-4"></div>
                    <div class="box unfocused" id="box-3-5"></div>
                </div>
                <div class="display">
                    <div class="box unfocused" id="box-4-1"></div>
                    <div class="box unfocused" id="box-4-2"></div>
                    <div class="box unfocused" id="box-4-3"></div>
                    <div class="box unfocused" id="box-4-4"></div>
                    <div class="box unfocused" id="box-4-5"></div>
                </div>
                <div class="display">
                    <div class="box unfocused" id="box-5-1"></div>
                    <div class="box unfocused" id="box-5-2"></div>
                    <div class="box unfocused" id="box-5-3"></div>
                    <div class="box unfocused" id="box-5-4"></div>
                    <div class="box unfocused" id="box-5-5"></div>
                </div>
                <div class="display">
                    <div class="box unfocused" id="box-6-1"></div>
                    <div class="box unfocused" id="box-6-2"></div>
                    <div class="box unfocused" id="box-6-3"></div>
                    <div class="box unfocused" id="box-6-4"></div>
                    <div class="box unfocused" id="box-6-5"></div>
                </div>
            </div>
        </main>
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title"></h2>
                <p id="modal-text"></p>
                <button id="repeatButton">Repetir</button>
                <button id="backButton">Voltar</button>
            </div>
        </div>
        <script type="module" src="./js/runTerm.js"></script>
    </body>
</html>
